<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login - Hijab Bloom</title>
  <link rel="icon" type="image/jpg" href="images/hijab bloom pic.jpg">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/registration.css">
</head>

<body>
  <div class="register-box">
    <h3 class="mb-3 text-center name">Welcome Back</h3>
    <h4 class="mb-4 text-center">Login to Your Account</h4>

    <form id="registration-form">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input id="regName" class="form-control" required placeholder="Enter your name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="regEmail" class="form-control" required placeholder="Enter your email">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="regPass" class="form-control" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn10 w-100 py-2">Login & Continue</button>
    </form>
  </div>

<script>
$('#registration-form').on('submit', function(e) {
  e.preventDefault();
  const name = $('#regName').val().trim();
  const email = $('#regEmail').val().trim();
  const pass = $('#regPass').val();

  if (!name || !email || !pass) {
    alert('Please fill all fields');
    return;
  }

  sessionStorage.setItem('hb_user', JSON.stringify({ name, email }));
  alert('Login successful! Redirecting to cart...');
  window.location.href = 'cart.html';
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
